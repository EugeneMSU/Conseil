    <!-- Main Application Script -->
    <script type="text/babel" data-type="module" data-presets="typescript,react">
      import React, { useState, useEffect, useRef } from 'react';
      import ReactDOM from 'react-dom/client';
      import * as THREE from 'three';
      import { Canvas, useFrame, extend } from '@react-three/fiber';
      import { OrbitControls, shaderMaterial, Stars } from '@react-three/drei';
      import { motion, AnimatePresence } from 'framer-motion';
      import { Menu, X, Scale, FileText, ChevronRight, Cpu, UserCheck, AlertTriangle, CheckCircle } from 'lucide-react';

      // --- 1. TYPES & DATA ---
      
      const navItems = [
        { label: 'Введение', id: 'intro' },
        { label: 'Модель Франции', id: 'france' },
        { label: 'Реформа 2020', id: 'russia' },
        { label: 'ИИ и Управление', id: 'ai' },
        { label: 'Заключение', id: 'conclusion' },
      ];

      // --- 2. 3D VISUALS (HeroScene) ---

      // Create a custom shader material for the Hologram effect
      const HologramMaterial = shaderMaterial(
        {
          uTime: 0,
          uColor: new THREE.Color('#a855f7'), // Purple-500
        },
        // Vertex Shader
        `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          uniform float uTime;

          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            
            // Dynamic wobble / distortion
            vec3 pos = position;
            float warp = sin(pos.y * 3.0 + uTime) * 0.1 + cos(pos.z * 2.0 + uTime * 1.5) * 0.1;
            pos += normal * warp * 0.5;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        // Fragment Shader
        `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          uniform float uTime;
          uniform vec3 uColor;

          // Pseudo-random noise
          float random(vec2 p) {
            return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
          }

          void main() {
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            
            // Fresnel effect for edge glow
            float fresnel = dot(viewDir, normal);
            fresnel = clamp(1.0 - fresnel, 0.0, 1.0);
            fresnel = pow(fresnel, 2.0);

            // High frequency noise for "digital entropy" look
            float noise = random(vUv * 100.0 + uTime);
            
            // Horizontal scanlines
            float scanline = sin(vUv.y * 200.0 + uTime * 2.0) * 0.05;

            // Base color with noise
            vec3 finalColor = uColor + vec3(noise * 0.2);
            
            // Alpha calculation: transparent center, opaque edges (fresnel), plus noise
            float alpha = fresnel * 0.8 + noise * 0.15 + 0.1;
            
            gl_FragColor = vec4(finalColor, alpha);
          }
        `
      );

      // Register the material so it can be used as a JSX element
      extend({ HologramMaterial });

      const HologramSphere = () => {
        const materialRef = useRef(null);
        
        useFrame((state) => {
          if (materialRef.current) {
            materialRef.current.uTime = state.clock.getElapsedTime();
          }
        });

        return (
          <mesh scale={2.2}>
            {/* High segment count for smooth shader distortion */}
            <sphereGeometry args={[1, 128, 128]} /> 
            {/* @ts-ignore */}
            <hologramMaterial 
              ref={materialRef} 
              transparent 
              side={THREE.DoubleSide}
              depthWrite={false} // Important for transparency
              blending={THREE.AdditiveBlending} // Glowy look
            />
          </mesh>
        );
      };

      const HeroScene = ({ className }) => {
        return (
          <div className={`absolute inset-0 z-0 ${className}`}>
            <Canvas camera={{ position: [0, 0, 5], fov: 45 }}>
              <color attach="background" args={['#000000']} />
              
              {/* Subtle stars for depth */}
              <Stars radius={100} depth={50} count={2000} factor={4} saturation={0} fade speed={0.5} />
              
              <HologramSphere />
              
              <OrbitControls 
                enableZoom={false} 
                enablePan={false} 
                autoRotate={true}
                autoRotateSpeed={0.5}
              />
            </Canvas>
          </div>
        );
      };

      // --- 3. COMPONENTS ---

      const Navigation = () => {
        const [isOpen, setIsOpen] = useState(false);
        const [scrolled, setScrolled] = useState(false);

        useEffect(() => {
          const handleScroll = () => {
            setScrolled(window.scrollY > 50);
          };
          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        const scrollToSection = (id) => {
          const element = document.getElementById(id);
          if (element) {
            element.scrollIntoView({ behavior: 'smooth' });
            setIsOpen(false);
          }
        };

        const textColorClass = scrolled ? 'text-stone-600 hover:text-stone-900' : 'text-stone-300 hover:text-white';
        const logoColorClass = scrolled ? 'text-stone-900' : 'text-white';
        const mobileMenuBg = scrolled ? 'bg-stone-50' : 'bg-stone-900';
        const mobileTextColor = scrolled ? 'text-stone-800' : 'text-stone-100';

        return (
          <nav className={`fixed top-0 left-0 w-full z-50 transition-all duration-300 ${scrolled ? 'bg-stone-50/90 backdrop-blur-md py-4 border-b border-stone-200' : 'bg-transparent py-8'}`}>
            <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
              <div className={`text-xs font-sans tracking-[0.2em] font-bold cursor-pointer transition-colors ${logoColorClass}`} onClick={() => scrollToSection('hero')}>
                {/* Logo Placeholder */}
              </div>

              <div className="hidden md:flex space-x-8">
                {navItems.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => scrollToSection(item.id)}
                    className={`text-xs uppercase tracking-widest transition-colors ${textColorClass}`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>

              <div className="md:hidden">
                <button onClick={() => setIsOpen(!isOpen)} className={`p-2 ${logoColorClass}`}>
                  {isOpen ? <X size={24} /> : <Menu size={24} />}
                </button>
              </div>
            </div>

            {isOpen && (
              <div className={`absolute top-full left-0 w-full ${mobileMenuBg} border-b border-stone-800 md:hidden flex flex-col items-center py-8 space-y-6 shadow-2xl`}>
                 {navItems.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => scrollToSection(item.id)}
                    className={`text-lg font-sans ${mobileTextColor}`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>
            )}
          </nav>
        );
      };

      const IntroSection = () => {
        return (
          <section id="intro" className="py-24 px-6 max-w-5xl mx-auto">
            <div className="grid grid-cols-1 md:grid-cols-12 gap-12">
              <div className="md:col-span-4">
                <motion.div
                  initial={{ opacity: 0, x: -20 }}
                  whileInView={{ opacity: 1, x: 0 }}
                  transition={{ duration: 0.8 }}
                  className="sticky top-32"
                >
                  <h2 className="text-3xl md:text-4xl font-sans font-bold leading-tight mb-6">
                    Контекст<br/>
                  </h2>
                  <div className="h-1 w-24 bg-stone-900 mb-6"></div>
                  <p className="text-sm font-sans text-stone-500 uppercase tracking-widest">
                    
                  </p>
                </motion.div>
              </div>
              <div className="md:col-span-8 space-y-8 text-lg text-stone-700 leading-relaxed font-sans">
                <motion.p
                  initial={{ opacity: 0, y: 20 }}
                  whileInView={{ opacity: 1, y: 0 }}
                  transition={{ duration: 0.8, delay: 0.2 }}
                >
                  <span className="text-6xl float-left mr-3 mt-[-10px] font-bold text-stone-900">С</span>
                  татья посвящена сравнительно-правовому анализу <strong>Государственного совета Франции</strong> (Conseil d'État). Цель работы — поиск практического опыта, который может быть адаптирован для Государственного совета Российской Федерации.
                </motion.p>
                <motion.p
                  initial={{ opacity: 0, y: 20 }}
                  whileInView={{ opacity: 1, y: 0 }}
                  transition={{ duration: 0.8, delay: 0.4 }}
                >
                  В центре внимания — двойственная природа французского органа, совмещающего функции судьи и консультанта, а также перспективы эволюции российского аналога после конституционной реформы 2020 года.
                </motion.p>
                
                <motion.div 
                  initial={{ opacity: 0, scale: 0.95 }}
                  whileInView={{ opacity: 1, scale: 1 }}
                  transition={{ duration: 0.8, delay: 0.6 }}
                  className="bg-stone-200/50 p-8 rounded-lg border-l-4 border-stone-400 my-8"
                >
                  <h3 className="text-xl font-bold mb-2 text-stone-900 font-sans">Ключевая гипотеза</h3>
                  <p className="text-stone-600">
                    Российский Госсовет не может слепо копировать судебные функции французского коллеги из-за различий в конституционном строе, но может перенять инструменты превентивной экспертизы, согласительных процедур и аналитики, особенно в эпоху цифровизации.
                  </p>
                </motion.div>
              </div>
            </div>
          </section>
        );
      };

      const FrenchModel = () => {
        const [activeTab, setActiveTab] = useState('consultative');

        return (
          <section id="france" className="py-24 bg-stone-100 px-6">
            <div className="max-w-6xl mx-auto">
              <div className="text-center mb-16">
                <h2 className="text-4xl md:text-5xl font-sans font-bold mb-4">Conseil d'État</h2>
                <p className="text-stone-500 font-sans uppercase tracking-widest">Двойственная Природа</p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                {/* Interactive Graphic */}
                <div className="relative h-[400px] flex items-center justify-center bg-stone-200 rounded-full overflow-hidden shadow-inner">
                   <div className="absolute inset-0 bg-stone-50 opacity-50 rounded-full scale-90 blur-3xl"></div>
                   
                   <motion.div 
                     animate={{ 
                       x: activeTab === 'consultative' ? -50 : 50,
                       rotate: activeTab === 'consultative' ? -5 : 5
                     }}
                     transition={{ type: "spring", stiffness: 100 }}
                     className="relative z-10 bg-white w-64 h-64 rounded-2xl shadow-xl flex flex-col items-center justify-center p-6 text-center border border-stone-100"
                   >
                      {activeTab === 'consultative' ? (
                        <FileText size={48} className="text-blue-900 mb-4" />
                      ) : (
                        <Scale size={48} className="text-red-900 mb-4" />
                      )}
                      <h3 className="text-xl font-bold font-sans mb-2">
                        {activeTab === 'consultative' ? 'Консультант' : 'Судья'}
                      </h3>
                      <p className="text-sm text-stone-500 font-sans">
                        {activeTab === 'consultative' 
                          ? 'Экспертиза законопроектов до их внесения в парламент.' 
                          : 'Высшая инстанция административной юстиции.'}
                      </p>
                   </motion.div>
                </div>

                {/* Controls & Content */}
                <div className="space-y-8">
                  <div className="flex space-x-4 border-b border-stone-300 pb-4">
                    <button 
                      onClick={() => setActiveTab('consultative')}
                      className={`text-lg font-sans pb-2 transition-colors ${activeTab === 'consultative' ? 'text-stone-900 font-bold border-b-2 border-stone-900' : 'text-stone-400'}`}
                    >
                      Административная роль
                    </button>
                    <button 
                      onClick={() => setActiveTab('judicial')}
                      className={`text-lg font-sans pb-2 transition-colors ${activeTab === 'judicial' ? 'text-stone-900 font-bold border-b-2 border-stone-900' : 'text-stone-400'}`}
                    >
                      Судебная роль
                    </button>
                  </div>

                  <div className="h-64 relative">
                    <AnimatePresence mode="wait">
                      {activeTab === 'consultative' && (
                        <motion.div 
                          key="cons"
                          initial={{ opacity: 0, x: 20 }}
                          animate={{ opacity: 1, x: 0 }}
                          exit={{ opacity: 0, x: -20 }}
                          className="space-y-4"
                        >
                          <h4 className="text-2xl font-sans">Фильтр качества законов</h4>
                          <p className="text-stone-600 leading-relaxed font-sans">
                            Согласно ст. 39 Конституции 1958 г., проекты законов рассматриваются Государственным советом. Это "превентивная экспертиза", обеспечивающая юридическую чистоту актов.
                          </p>
                          <ul className="space-y-2 text-sm font-semibold text-stone-800 font-sans">
                            <li className="flex items-center"><ChevronRight size={16} className="mr-2"/> Проверка конституционности</li>
                            <li className="flex items-center"><ChevronRight size={16} className="mr-2"/> Анализ целесообразности</li>
                            <li className="flex items-center"><ChevronRight size={16} className="mr-2"/> Независимость суждений</li>
                          </ul>
                        </motion.div>
                      )}
                      
                      {activeTab === 'judicial' && (
                        <motion.div 
                          key="jud"
                          initial={{ opacity: 0, x: 20 }}
                          animate={{ opacity: 1, x: 0 }}
                          exit={{ opacity: 0, x: -20 }}
                          className="space-y-4"
                        >
                          <h4 className="text-2xl font-sans">Административная юстиция</h4>
                          <p className="text-stone-600 leading-relaxed font-sans">
                            Кассационный пересмотр решений и прямая инстанция для актов общенационального значения (указы, ордонансы, гегламенты и другие административные акты).
                          </p>
                          <div className="bg-white p-4 rounded shadow-sm border border-stone-200">
                            <p className="text-xs text-stone-400 uppercase mb-1 font-sans"></p>
                            <p className="font-bold text-stone-800 font-sans">Дело Association AC (2004)</p>
                            <p className="text-sm text-stone-600 mt-2 font-sans">Согласно принципу, установленному Conseil d'État в решении от 11 мая 2004 года (Association AC ! et autres, № 255886), административный суд вправе отсрочить правовые последствия отмены незаконного административного акта, если немедленное прекращение его действия причинит чрезмерный вред общественным интересам либо создаст непропорциональную правовую неопределенность по сравнению с целями аннулирования.</p>
                          </div>
                        </motion.div>
                      )}
                    </AnimatePresence>
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      };

      const RussianReform = () => {
        const timelineData = [
          { year: '2000', title: 'Создание', desc: 'Указ Президента. Консультативная площадка.' },
          { year: '2020', title: 'Поправки к Конституции', desc: 'Ст. 83. Госсовет становится конституционным государственным органом. Понятие "Единая система публичной власти".' },
          { year: '2020 (Дек)', title: 'ФЗ № 394', desc: 'Закон закрепил статус: координация, стратегическое планирование, но без властных полномочий.' },
          { year: '2023', title: 'Постановление КС РФ', desc: 'Развитие концепции единой системы публичной власти и роль Госсовета в согласовании.' },
        ];

        return (
          <section id="russia" className="py-24 px-6 max-w-6xl mx-auto">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-16">
              <div>
                <h2 className="text-4xl font-sans font-bold mb-6">Российская траектория</h2>
                <p className="text-lg text-stone-600 mb-8 leading-relaxed font-sans">
                  От совещательного органа к конституционному институту. Реформа 2020 года открыла новые возможности, но оставила открытым вопрос о функциональном наполнении.
                </p>
                <div className="p-6 bg-stone-900 text-stone-50 rounded-lg shadow-xl">
                   <h4 className="text-xl font-bold mb-4 font-sans">Вызовы</h4>

                   </p>
                   <div className="w-full h-px bg-stone-700 my-4"></div>
                   <p className="font-sans text-lg">
                     "Орган стратегической координации."
                   </p>
                </div>
              </div>

              <div className="relative border-l border-stone-300 ml-4 md:ml-0 pl-8 md:pl-12 py-4">
                 {timelineData.map((item, index) => (
                   <motion.div 
                     key={index}
                     initial={{ opacity: 0, x: -20 }}
                     whileInView={{ opacity: 1, x: 0 }}
                     transition={{ duration: 0.5, delay: index * 0.1 }}
                     className="mb-12 relative"
                   >
                     <span className="absolute -left-[41px] md:-left-[57px] top-1 w-4 h-4 rounded-full bg-stone-900 border-4 border-stone-50"></span>
                     <span className="text-sm font-bold text-stone-400 font-sans tracking-widest">{item.year}</span>
                     <h3 className="text-2xl font-sans font-bold mt-1 mb-2">{item.title}</h3>
                     <p className="text-stone-600 font-sans">{item.desc}</p>
                   </motion.div>
                 ))}
              </div>
            </div>
          </section>
        );
      };

      const AISection = () => {
        return (
          <section id="ai" className="py-24 bg-stone-900 text-stone-50 overflow-hidden relative">
            <div className="absolute top-0 right-0 w-1/2 h-full opacity-10 pointer-events-none">
              <svg viewBox="0 0 100 100" className="w-full h-full fill-current">
                 <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
                   <path d="M 10 0 L 0 0 0 10" fill="none" stroke="currentColor" strokeWidth="0.5"/>
                 </pattern>
                 <rect width="100" height="100" fill="url(#grid)" />
              </svg>
            </div>

            <div className="max-w-7xl mx-auto px-6 relative z-10">
              <div className="mb-16 md:w-2/3">
                <h2 className="text-4xl md:text-5xl font-sans font-bold mb-6">Цифровой вызов</h2>
                <p className="text-xl text-stone-300 leading-relaxed font-sans">
                  Внедрение ИИ в госуправление (виртуальные министры, чат-боты) порождает новые правовые споры. Может ли Госсовет РФ стать арбитром в цифровых публичных спорах?
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                {/* Card 1: Albania */}
                <motion.div 
                  whileHover={{ y: -5 }}
                  className="bg-stone-800 p-8 rounded-xl border border-stone-700"
                >
                  <div className="flex items-center space-x-4 mb-6">
                    <div className="p-3 bg-blue-900/50 rounded-lg">
                      <Cpu size={32} className="text-blue-300" />
                    </div>
                    <div>
                      <h3 className="text-2xl font-bold font-sans">Diella (Албания)</h3>
                      <span className="text-xs font-mono text-blue-300 uppercase">Эксперимент 2025</span>
